<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hyderabad Heritage AI Guide</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet"
          href="/static/css/style.css">
</head>
<body>

<!-- BACKGROUND -->
<div class="background-container">
    <div class="background-image"></div>
    <div class="background-overlay"></div>
</div>

<!-- MAIN APPLICATION -->
<div class="app-container">

    <!-- HEADER WITH LOGO AND TITLE -->
    <header class="app-header">
        <div class="header-wrapper">
            <div class="logo-section">
                <img src="/static/images/hyd_logo.jpg" alt="Hyderabad Logo" class="app-logo">
            </div>
            <div class="title-section">
                <h1 class="app-title">Hyderabad Heritage AI Guide</h1>
                <p class="app-subtitle">Ask anything about Hyderabad's history, food, culture and attractions.</p>
            </div>
        </div>
    </header>

    <!-- CHAT PANEL -->
    <div class="chat-panel">
        
        <!-- MESSAGES AREA -->
        <div class="messages-area" id="messagesArea">

            
                

                    <!-- USER MESSAGE -->
                    <div class="message-wrapper user-wrapper">
                        <div class="user-message-bubble">
                            Test
                        </div>
                    </div>

                    <!-- AI MESSAGE -->
                    <div class="message-wrapper ai-wrapper">
                        <!-- AUTO IMAGE DISPLAY -->
                        <div class="message-image-container" id="img-1"></div>
                        
                        <div class="ai-message-bubble ">
                            <script type="text/markdown" class="assistant-md">## Introduction to Hyderabad

Hyderabad is a city known for its history, culture, food, and architecture.

### Places to Visit

- **Charminar**
- **Golconda Fort**
- **Hussain Sagar Lake**
- **Necklace Road**

### General Advice

1. Explore the Old City.
2. Try Hyderabad Biryani.
3. Visit major heritage attractions.
</script>
                            <div class="assistant-html"></div>
                        </div>
                    </div>

                

            

        </div>

        <!-- INPUT FORM -->
        <form method="POST" class="input-form" id="chatForm">
            <div class="input-container">
                <input
                    type="text"
                    name="query"
                    placeholder="Ask anything about Hyderabad..."
                    class="message-input"
                    id="questionInput"
                    required>
                <button type="submit" class="send-btn" title="Send message">
                    <span class="send-icon">→</span>
                </button>
            </div>
        </form>

    </div>

</div>

<script>

// IMAGE MAPPING FOR AUTO-DISPLAY
const imageMap = {
    'charminar': '/static/images/charminar.jpg',
    'golconda': '/static/images/golconda.jpg',
    'food': '/static/images/biryani.jpg',
    'biryani': '/static/images/biryani.jpg',
    'restaurant': '/static/images/biryani.jpg',
    'eat': '/static/images/biryani.jpg'
};

// DISPLAY IMAGES BASED ON USER QUERY
function displayRelevantImages() {
    const userWrappers = document.querySelectorAll('.user-wrapper');
    userWrappers.forEach((userWrapper, index) => {
        const userText = userWrapper.innerText.toLowerCase();
        const imageContainer = userWrapper.nextElementSibling?.querySelector('.message-image-container');
        
        if (imageContainer) {
            for (const [keyword, imagePath] of Object.entries(imageMap)) {
                if (userText.includes(keyword)) {
                    imageContainer.innerHTML = `<img src="${imagePath}" alt="Related image" class="message-image">`;
                    break;
                }
            }
        }
    });
}

// AUTO-SCROLL TO LATEST MESSAGE
function scrollToBottom() {
    const messagesArea = document.getElementById('messagesArea');
    setTimeout(() => {
        messagesArea.scrollTop = messagesArea.scrollHeight;
    }, 100);
}

// RENDER MARKDOWN FROM SCRIPT TAGS
function renderMarkdown() {
    const mdScripts = document.querySelectorAll('script.assistant-md');
    mdScripts.forEach(s => {
        const md = s.textContent || (s.innerText || '');
        let html = md;
        try {
            if (window.marked) {
                html = marked.parse(md);
            } else {
                html = md.replace(/\n/g, '<br>');
            }
        } catch (e) {
            html = md.replace(/\n/g, '<br>');
        }
        let clean = html;
        try {
            if (window.DOMPurify) {
                clean = DOMPurify.sanitize(html);
            }
        } catch (e) {
            clean = html;
        }
        const container = s.nextElementSibling;
        if (container) {
            container.innerHTML = clean;
        }
    });
}

// INITIALIZE ON PAGE LOAD
document.addEventListener('DOMContentLoaded', function() {
    displayRelevantImages();
    renderMarkdown();
    scrollToBottom();

    // FORM SUBMISSION - Allow normal form submission
    // Form will POST to server and page will reload with new chat_history
});


</script>

<!-- Markdown rendering libraries (CDN) -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@2.4.0/dist/purify.min.js"></script>

</body>
</html>
